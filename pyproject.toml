[project]
name = "travelguardian"
version = "0.1.0"
description = "Travel assistant agent: reads confirmations, builds itineraries, watches for disruptions, rebooks only with approval."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "mcp>=2.3",
    "pydantic>=2.7",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Gmail + Google Calendar (OAuth 2.0). Without these, the local inbox/calendar fallbacks are used.
google = ["google-api-python-client>=2.100", "google-auth>=2.20", "google-auth-oauthlib>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
tg = "travelguardian.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["travelguardian"]
